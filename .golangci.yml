linters:
  enable-all: true
  disable:
    - tenv

linters-settings:
  gofumpt:
    extra-rules: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
      - experimental
    disabled-checks:
      - commentedOutCode
      - whyNoLint
  funlen:
    lines: 100
    statements: 50
  gocognit:
    min-complexity: 20
  gocyclo:
    min-complexity: 15
  cyclop:
    max-complexity: 15
  lll:
    line-length: 140
  varnamelen:
    max-distance: 8
    min-name-length: 2
    ignore-names:
      - ok
      - id
      - w
      - f
      - a
      - e
      - q
      - g
      - c
      - u
      - ev
      - ss
      - sb
      - tt
      - w
  mnd:
    ignored-numbers:
      - 0; 1; 2; 3; 200; 300; 400; 401; 403; 404; 422; 429; 500; 0o600; 0o700
    ignored-functions:
      - 'strconv.Format*'
      - 'os.*'
      - 'fmt.*'
  nestif:
    min-complexity: 6
  goconst:
    min-len: 4
    min-occurrences: 3
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true
      - name: unused-parameter
        severity: warning
  gosec:
    excludes:
      - G104
  depguard:
    rules:
      main:
        allow:
          - $gostd
          - github.com/Thejuampi/icu
  wrapcheck:
    ignore-sigs:
      - 'fmt.Errorf('
    ignore-package-globs:
      - github.com/Thejuampi/icu
  tagliatelle:
    case:
      rules:
        json: camel
  forbidigo:
    forbid:
      - '^fmt\.Print(|f|ln)$'

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gochecknoglobals
        - varnamelen
        - funlen
        - goconst
        - dupl
        - mnd
        - noctx
    - path: _test\.go
      text: "t.Helper"
      linters:
        - thelper
    - path: cmd_.*\.go
      linters:
        - wrapcheck          # CLI cmd files pass library errors through intentionally
        - gochecknoinits     # init() is the standard Go self-registration pattern

  exclude-dirs:
    - bin
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
