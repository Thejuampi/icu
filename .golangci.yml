linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gci
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gofmt
    - gofumpt
    - goheader
    - goimports
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosimple
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - stylecheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint

linters-settings:
  gofumpt:
    extra-rules: true
  dupl:
    threshold: 100
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
      - experimental
  funlen:
    lines: 120
    statements: 50
  gocognit:
    min-complexity: 20
  gocyclo:
    min-complexity: 15
  cyclop:
    max-complexity: 15
  lll:
    line-length: 200
  varnamelen:
    max-distance: 8
    min-name-length: 2
    ignore-names:
      - ok
      - id
      - t
      - i
      - w
      - f
      - a
      - e
      - q
      - g
      - c
      - u
      - ev
      - ss
      - sb
      - tt
      - w
  mnd:
    ignored-numbers:
      - "0"
      - "1"
      - "2"
      - "3"
      - "200"
      - "300"
      - "400"
      - "401"
      - "403"
      - "404"
      - "422"
      - "429"
      - "500"
      - "0o600"
      - "0o700"
    ignored-functions:
      - 'strconv.Format*'
      - 'os.*'
      - 'fmt.*'
  nestif:
    min-complexity: 6
  goconst:
    min-len: 4
    min-occurrences: 3
  depguard:
    rules:
      main:
        allow:
          - $gostd
          - github.com/Thejuampi/icu
          - golang.org/x/term
  wrapcheck:
    ignore-sigs:
      - 'fmt.Errorf('
    ignore-package-globs:
      - github.com/Thejuampi/icu*
  forbidigo:
    forbid:
      - '^fmt\.Print(|f|ln)$'

issues:
  exclude-dirs:
    - bin
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
