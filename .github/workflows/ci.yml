name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  # AGENTS.md: coverage below 90% is a build failure.
  COVERAGE_FLOOR: "90.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
          out="$("$(go env GOPATH)/bin/gofumpt" -l .)"
          if [ -n "$out" ]; then echo "gofumpt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test -race with coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./... | tee test.out

      - name: Coverage floor
        run: |
          set -euo pipefail
          check() {
            awk -v name="$1" -v pct="$2" -v floor="$COVERAGE_FLOOR" 'BEGIN {
              sub("%", "", pct);
              if (pct + 0 < floor + 0) { printf "%s coverage %s%% < %s%%\n", name, pct, floor; exit 1 }
              printf "%s coverage %s%% >= %s%%\n", name, pct, floor }'
          }
          cmd_pct="$(awk '$2 == "github.com/Thejuampi/icu/cmd/icu" { for (i = 1; i <= NF; i++) if ($i == "coverage:") print $(i+1) }' test.out)"
          [ -n "$cmd_pct" ] || { echo "cmd/icu coverage not found"; exit 1; }
          check "cmd/icu" "$cmd_pct"
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { print $NF }')"
          check "total" "$total"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
