name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Same key for push and pull_request runs of a branch; never cancel master.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'master' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  # AGENTS.md: coverage below 90% is a build failure.
  COVERAGE_FLOOR: "90.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
          out="$("$(go env GOPATH)/bin/gofumpt" -l .)"
          if [ -n "$out" ]; then echo "gofumpt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test -race with coverage
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... | tee test.out

      - name: Coverage floor script tests
        run: bash scripts/coverage-floor_test.sh

      - name: Coverage floor (every package from go list)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          bash scripts/coverage-floor.sh test.out "$COVERAGE_FLOOR" $(go list ./...)
          go tool cover -func=coverage.out | awk '/^total:/ { print "total " $NF }'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
