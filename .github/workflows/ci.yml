name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  # AGENTS.md: coverage below 90% is a build failure.
  COVERAGE_FLOOR: "90.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${GOFUMPT_VERSION}
          out="$("$(go env GOPATH)/bin/gofumpt" -l .)"
          if [ -n "$out" ]; then echo "gofumpt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test -race with coverage
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... | tee test.out

      - name: Coverage floor (every package)
        run: |
          set -euo pipefail
          # Every package that has statements must meet the floor; a package
          # with no test files fails too.
          if grep -E '^\?\s+\S+\s+\[no test files\]' test.out; then
            echo "packages without tests (see above)"; exit 1
          fi
          awk -v floor="$COVERAGE_FLOOR" '
            $1 == "ok" {
              pct = ""
              for (i = 1; i <= NF; i++) if ($i == "coverage:") pct = $(i+1)
              if (pct == "" || pct == "[no") next
              sub("%", "", pct); n++
              if (pct + 0 < floor + 0) { printf "FAIL %s coverage %s%% < %s%%\n", $2, pct, floor; bad = 1 }
              else printf "ok   %s coverage %s%% >= %s%%\n", $2, pct, floor
            }
            END { if (n == 0) { print "no coverage lines found"; exit 1 } exit bad }' test.out
          go tool cover -func=coverage.out | awk '/^total:/ { print "total " $NF }'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
